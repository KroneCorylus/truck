[package]
name = "truck-hlr"
version = "0.1.0"
edition = "2021"
description = "Hidden-line projection of solids onto a plane, as drafting curves"
homepage = "https://github.com/ricosjp/truck"
repository = "https://github.com/ricosjp/truck"
license = "Apache-2.0"

keywords = ["truck", "graphics", "drawing"]
categories = ["graphics"]

[dependencies]
itertools = "0.15.0"
truck-drafting = { version = "0.1.0", path = "../truck-drafting" }
truck-meshalgo = { version = "0.4.0", path = "../truck-meshalgo" }
truck-modeling = { version = "0.6.0", path = "../truck-modeling" }

[dev-dependencies]
derive_more = { version = "2.1.1", features = ["full"] }
rustc-hash = "2.1.3"
truck-geometry = { version = "0.5.0", path = "../truck-geometry" }
truck-geotrait = { version = "0.4.0", path = "../truck-geotrait", features = ["derive"] }
truck-shapeops = { version = "0.4.0", path = "../truck-shapeops" }
truck-topology = { version = "0.6.0", path = "../truck-topology" }
